<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Report Summarizer</title>
<style>
  :root{
    --ink:#1c2530;
    --paper:#f4f6f8;
    --card:#ffffff;
    --navy:#1f3a5f;
    --navy-deep:#152a45;
    --line:#dfe4ea;
    --muted:#6b7684;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Inter","Segoe UI",system-ui,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    width:100%;
    max-width:360px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:32px 28px;
    box-shadow:0 1px 2px rgba(20,30,45,.04);
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;
    font-size:22px;
    margin:0 0 6px;
    color:var(--navy-deep);
  }
  p{
    color:var(--muted);
    font-size:13.5px;
    margin:0 0 20px;
  }
  .flash{
    background:#fdecec;
    border:1px solid #f3c6c6;
    color:#8a2c2c;
    font-size:13px;
    padding:8px 10px;
    border-radius:6px;
    margin-bottom:16px;
  }
  input[type=password]{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:7px;
    font-size:14px;
    margin-bottom:14px;
  }
  button{
    width:100%;
    background:var(--navy);
    color:#fff;
    border:none;
    border-radius:7px;
    padding:12px 16px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  button:hover{ background:var(--navy-deep); }
</style>
</head>
<body>
  <div class="card">
    <h1>Report Summarizer</h1>
    <p>Enter the access password to continue.</p>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}
          <div class="flash">{{ m }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="post">
      <input type="password" name="password" placeholder="Password" autofocus required />
      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
